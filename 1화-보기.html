<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a11">
  <title>혼노지의 변 1화 — 동쪽으로</title>
  <style>
    html { background: #080a11; }
    body { margin: 0; background: #080a11; color: #eee; }
    main { width: min(100%, 1024px); margin: 0 auto; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main aria-label="혼노지의 변 1화 — 동쪽으로">
    <img src="01-제국의-끝자락.png" alt="1582년의 전쟁과 교토 혼노지에서 노부나가가 원군을 보내기로 한다" width="1024" loading="eager">
    <img src="02-닫힌-명령.png" alt="가메야마성에서 미쓰히데가 군을 출발시킨다" width="1024" loading="lazy">
    <img src="03-길이-꺾이는-밤.png" alt="오이노사카에서 미쓰히데의 군이 교토로 방향을 바꾼다" width="1024" loading="lazy">
    <img src="04-도라지-깃발.png" alt="동틀 무렵 아케치 군이 혼노지를 포위한다" width="1024" loading="lazy">
  </main>
</body>
</html>
